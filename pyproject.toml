[project]
name = "govguard"
version = "0.1.0"
description = "GovCloud Compliance Copilot"
requires-python = ">=3.13"
dependencies = [
    "pydantic-ai-slim[bedrock]==2.54.0",  # pinned, ADR 0005
]

[dependency-groups]
build = [
    "pydantic-ai-slim[groq]==2.54.0",  # build-only Groq fallback, pinned (ADR 0010)
    "pypdf==6.0.0",  # pinned, SDM is only available as PDF (ADR 0008)
]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.uv]
default-groups = ["build", "dev"]  # kb_build needs pypdf, the deployed app does not

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/govguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "C901", "PLR0913", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5
max-statements = 30  # small units, CLAUDE.md -> Leitplanken
