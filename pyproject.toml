[project]
name = "govguard"
version = "0.1.0"
description = "GovCloud Compliance Copilot"
license = "MIT"  # code only; data keeps the licenses of its sources (NOTICE)
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13"
dependencies = [
    "pydantic-ai-slim[bedrock,groq]==2.54.0",  # pinned, ADR 0005; Groq at runtime (ADR 0023)
]

[dependency-groups]
build = [
    "pypdf==6.0.0",  # pinned, SDM is only available as PDF (ADR 0008)
]
dev = [
    "pytest==9.1.1",
    "pytest-playwright==0.10.0",  # screenshot regression of the demo UI (#40)
    "ruff==0.16.10",
]
ui = [
    "streamlit==1.65.0",  # pinned, demo UI on Streamlit Community Cloud (ADR 0004, 0023)
]

[tool.uv]
default-groups = ["build", "dev", "ui"]  # kb_build needs pypdf, the Lambda needs neither

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/govguard", "src/govguard_ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not visual'"  # `pytest -m visual` overrides it and starts a browser (#40)
markers = ["visual: screenshot regression in a real browser, needs `playwright install chromium`"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".claude/skills/architecture-models-4plus1"]  # third-party skill, kept as shipped

[tool.ruff.lint]
select = ["E", "F", "I", "C901", "PLR0913", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5
max-statements = 30  # small units, CLAUDE.md -> Leitplanken
