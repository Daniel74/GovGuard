x-plausibilitaetspruefungen:
  beschreibung: |
    Formale Prüfungen, die die Schnittstelle vor der Annahme durchführt. Schlägt eine Prüfung fehl,
    antwortet die Schnittstelle mit `422` und dem Fehlercode im Feld `fehler[].code`. Die Prüfungen
    entscheiden nie über den Anspruch; das tut allein die Sachbearbeitung im Fachverfahren.
  regeln:
    - id: PL-01
      pruefung: Die antragstellende Person ist am Tag des Eingangs volljährig.
      felder: [/antragstellendePerson/geburtsdatum]
      code: nicht_zulaessig
    - id: PL-02
      pruefung: Der gewünschte Beginn ist der Erste eines Monats und liegt nicht vor dem Monat des Eingangs.
      felder: [/gewuenschterBeginn]
      code: wert_ausserhalb_bereich
    - id: PL-03
      pruefung: Bei Antragsart mietzuschuss ist `miete` angegeben und `belastung` leer.
      felder: [/antragsart, /miete, /belastung]
      code: widerspruch
    - id: PL-04
      pruefung: Bei Antragsart lastenzuschuss ist `belastung` angegeben und `miete` leer.
      felder: [/antragsart, /miete, /belastung]
      code: widerspruch
    - id: PL-05
      pruefung: Das Nutzungsverhältnis passt zur Antragsart (eigentuemer und wohnungsberechtigter nur beim Lastenzuschuss).
      felder: [/wohnung/nutzungsverhaeltnis, /antragsart]
      code: widerspruch
    - id: PL-06
      pruefung: Bei staatsangehoerigkeitGruppe drittstaat ist ein Aufenthaltstitel angegeben; sonst ist er leer.
      felder: [/antragstellendePerson/staatsangehoerigkeitGruppe, /antragstellendePerson/aufenthaltstitel]
      code: widerspruch
    - id: PL-07
      pruefung: Ein angegebener Aufenthaltstitel ist am gewünschten Beginn noch gültig.
      felder: [/antragstellendePerson/aufenthaltstitel/gueltigBis]
      code: wert_ausserhalb_bereich
    - id: PL-08
      pruefung: Jedes Haushaltsmitglied hat mindestens einen Eintrag in `einkommen`, gegebenenfalls mit Art keine.
      felder: [/einkommen, /haushaltsmitglieder]
      code: pflichtfeld_fehlt
    - id: PL-09
      pruefung: Jede Personenreferenz in `einkommen`, `freibetraege` und Nachweisen verweist auf eine vorhandene Person.
      felder: [/einkommen/*/person, /freibetraege/schwerbehinderung/*/person]
      code: widerspruch
    - id: PL-10
      pruefung: Bei `art = keine` ist `bruttoJaehrlich` gleich 0.
      felder: [/einkommen/*/bruttoJaehrlich]
      code: widerspruch
    - id: PL-11
      pruefung: Bei `art = sonstige` ist `bezeichnung` angegeben.
      felder: [/einkommen/*/bezeichnung]
      code: pflichtfeld_fehlt
    - id: PL-12
      pruefung: Werbungskosten sind nicht höher als das Bruttoeinkommen derselben Einkunft.
      felder: [/einkommen/*/werbungskostenJaehrlich]
      code: wert_ausserhalb_bereich
    - id: PL-13
      pruefung: Ein Haushaltsmitglied mit Transferleistung, die die Unterkunftskosten deckt, ist nicht die antragstellende Person.
      felder: [/haushaltsmitglieder/*/bezugTransferleistung]
      code: nicht_zulaessig
    - id: PL-14
      pruefung: Die Wohnfläche liegt zwischen 5 und 400 Quadratmetern; die untervermietete Fläche ist kleiner als die Wohnfläche.
      felder: [/wohnung/wohnflaeche, /wohnung/untervermieteteFlaeche]
      code: wert_ausserhalb_bereich
    - id: PL-15
      pruefung: Das Einzugsdatum liegt nicht in der Zukunft.
      felder: [/wohnung/einzugsdatum]
      code: wert_ausserhalb_bereich
    - id: PL-16
      pruefung: Bei `heizkostenEnthalten = true` ist `heizkosten` angegeben.
      felder: [/miete/heizkosten]
      code: pflichtfeld_fehlt
    - id: PL-17
      pruefung: Die Summe aus Grundmiete und kalten Nebenkosten ist größer als 0.
      felder: [/miete/grundmiete, /miete/kalteNebenkosten]
      code: wert_ausserhalb_bereich
    - id: PL-18
      pruefung: Beim Lastenzuschuss ist mindestens ein Darlehen oder ein Erbbauzins angegeben.
      felder: [/belastung/darlehen, /belastung/erbbauzinsJaehrlich]
      code: pflichtfeld_fehlt
    - id: PL-19
      pruefung: Ein Freibetrag Schwerbehinderung mit GdB unter 100 setzt `pflegebeduerftig` und `haeuslichePflege` voraus.
      felder: [/freibetraege/schwerbehinderung/*]
      code: widerspruch
    - id: PL-20
      pruefung: Zu jedem Freibetrag Schwerbehinderung ist ein Nachweis schwerbehindertenausweis oder feststellungsbescheid_gdb angekündigt.
      felder: [/freibetraege/schwerbehinderung, /angekuendigteNachweise]
      code: pflichtfeld_fehlt
    - id: PL-21
      pruefung: Bei `alleinerziehend = true` gibt es kein Haushaltsmitglied mit Verhältnis ehegatte, lebenspartner oder partner_verantwortungsgemeinschaft.
      felder: [/freibetraege/alleinerziehend, /haushaltsmitglieder/*/verwandtschaftsverhaeltnis]
      code: widerspruch
    - id: PL-22
      pruefung: Kinder in `kinderMitEigenemEinkommen` sind am gewünschten Beginn zwischen 16 und 25 Jahre alt und haben ein Einkommen.
      felder: [/freibetraege/kinderMitEigenemEinkommen]
      code: widerspruch
    - id: PL-23
      pruefung: Die IBAN hat eine gültige Prüfziffer. Ausnahme Testumgebung, dort sind fiktive IBAN mit Prüfziffer 00 zulässig.
      felder: [/bankverbindung/iban]
      code: format_ungueltig
    - id: PL-24
      pruefung: Bei `kanal = postfach` ist `einwilligungPostfach = true` mit Zeitpunkt angegeben.
      felder: [/bescheidzustellung]
      code: pflichtfeld_fehlt
    - id: PL-25
      pruefung: Alle Pflichterklärungen sind true.
      felder: [/erklaerungen]
      code: pflichtfeld_fehlt
    - id: PL-26
      pruefung: Ein Weiterleistungsantrag geht frühestens zwei Monate vor Ende des laufenden Bewilligungszeitraums ein.
      felder: [/laufenderVorgang]
      code: wert_ausserhalb_bereich
    - id: PL-27
      pruefung: Bei `keineAenderungen = true` sind Haushalt, Miete und Belastung leer.
      felder: [/keineAenderungen]
      code: widerspruch
    - id: PL-28
      pruefung: Eine Rücknahme ist nur möglich, solange kein Bescheid ergangen ist.
      felder: [/erklaertAm]
      code: nicht_zulaessig
    - id: PL-29
      pruefung: Die Prüfsumme eines Nachweises stimmt mit dem dekodierten Inhalt überein.
      felder: [/sha256, /inhaltBase64]
      code: format_ungueltig
    - id: PL-30
      pruefung: Der Medientyp eines Nachweises passt zu den ersten Bytes des Inhalts (PDF, JPEG oder PNG).
      felder: [/mediaType, /inhaltBase64]
      code: format_ungueltig
